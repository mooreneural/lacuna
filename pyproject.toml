[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lacuna-pockets"
version = "1.0.3"
description = "Cryptic binding pocket discovery via conformational ensemble analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clayton Moore" }]
keywords = ["drug-discovery", "protein-structure", "cryptic-pockets", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "biopython>=1.81",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
openmm = ["openmm>=8.0", "pdbfixer>=1.9"]
# Sequence-augmented ranking (--rank-by learned-plm). Downloads an ESM-2
# checkpoint on first use; the fitted head itself ships with the package.
plm = ["torch>=2.0", "transformers>=4.30"]
boltz = ["boltz>=0.4"]
all = ["lacuna-pockets[openmm]", "lacuna-pockets[boltz]", "lacuna-pockets[plm]"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
lacuna = "lacuna.cli:main"

[project.urls]
Homepage = "https://github.com/mooreneural/lacuna"
Repository = "https://github.com/mooreneural/lacuna"
Issues = "https://github.com/mooreneural/lacuna/issues"

[tool.hatch.build.targets.wheel]
packages = ["lacuna"]

# The fitted sequence head (5.8 KB) ships with the package; only the ESM-2
# checkpoint it reads from is downloaded on demand.
[tool.hatch.build.targets.wheel.force-include]
"lacuna/pockets/plm_head.npz" = "lacuna/pockets/plm_head.npz"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
